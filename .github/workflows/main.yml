name: Extract Zyreon Panel

on:
  workflow_dispatch:
  push:
    paths:
      - "Zyreon-Panel-Root.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Extract Zyreon Panel
        run: |
          set -e

          rm -rf /tmp/zyreon
          mkdir -p /tmp/zyreon

          echo "Extracting ZIP..."
          unzip -q -o "Zyreon-Panel-Root.zip" -d /tmp/zyreon

          echo "Copying files..."
          rsync -a /tmp/zyreon/ ./ \
            --exclude=".git/" \
            --exclude=".github/workflows/extract.yml"

          echo "Extraction completed."

      - name: Remove ZIP
        run: rm -f "Zyreon-Panel-Root.zip"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Zyreon Panel"
            git push
          fi
