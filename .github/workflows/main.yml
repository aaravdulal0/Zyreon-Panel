name: Extract Zyreon Panel

on:
  workflow_dispatch:
  push:
    paths:
      - "Zyreon-Panel-Root.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP..."
          ls -lh Zyreon-Panel-Root.zip

          echo "Testing ZIP..."
          unzip -t Zyreon-Panel-Root.zip

          echo "Extracting..."
          rm -rf /tmp/zyreon
          mkdir -p /tmp/zyreon
          unzip -o Zyreon-Panel-Root.zip -d /tmp/zyreon

          echo "Copying files..."
          rsync -a /tmp/zyreon/ ./ \
            --exclude=".git/" \
            --exclude=".github/workflows/main.yml"

          echo "Done!"

      - name: Remove ZIP
        run: rm -f Zyreon-Panel-Root.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract Zyreon Panel"
            git push
          fi
