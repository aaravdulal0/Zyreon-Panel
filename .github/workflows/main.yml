name: Extract Zyreon Panel

on:
  push:
    paths:
      - 'Zyreon-Panel-Root.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/zyreon
          unzip -o Zyreon-Panel-Root.zip -d /tmp/zyreon
          rsync -a /tmp/zyreon/ ./

      - name: Remove ZIP
        run: |
          rm -f Zyreon-Panel-Root.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Zyreon Panel"
          git push
